name: SpotBugs Code Scanning

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write # Ключевой параметр для работы со вкладкой Security в GitHub

jobs:
  spotbugs:
    name: Run SpotBugs Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Замените на 11, 21 или вашу версию Java, если она отличается
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run SpotBugs
      run: ./gradlew spotbugsMain

    # Этот шаг берет сгенерированный SARIF-файл и красиво выводит ошибки в интерфейс GitHub
    - name: Upload SARIF file to GitHub Code Scanning
      uses: github/code-scanning-github-action@v2
      if: always() # Запускать, даже если SpotBugs нашел ошибки и прервал шаг выше
      with:
        sarif_file: build/reports/spotbugs/main.sarif
